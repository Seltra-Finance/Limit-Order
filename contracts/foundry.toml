[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200_000
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
# solc auto-detection: Seltra sources pin 0.8.24, vendored Permit2 pins 0.8.17.

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

# CI profile per spec 1.9: invariant tests at 10k+ runs.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 256
depth = 128

[rpc_endpoints]
avalanche = "${AVAX_RPC_URL}"
fuji = "${FUJI_RPC_URL}"
